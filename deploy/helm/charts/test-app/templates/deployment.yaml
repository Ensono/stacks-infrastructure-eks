apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-app
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
      containers:
        - name: {{ .Values.app.name }}-app
          image: {{ .Values.app.image }}
          args:
            - "-text={{ .Values.app.text }}"
